name: Cloudflare build check
on:
  push:
    branches: [cloudflare-migracao]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install preview dependencies without changing lockfile
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Build Cloudflare Worker
        run: npm run cf:build
